<html>
  <head>
    <title>Multi ChargePoint Simulator</title>
    <!-- Keep existing JS includes -->
    <script type="text/javascript" src="assets/js/addclasskillclass.js"></script>
    <script type="text/javascript" src="assets/js/attachevent.js"></script>
    <script type="text/javascript" src="assets/js/addcss.js"></script>
    <script type="text/javascript" src="assets/js/tabtastic.js"></script>
    <!-- For inner tabs -->
    <script src="https://unpkg.com/react@16/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.15.0/babel.min.js"></script>
    <link rel="stylesheet" type="text/css" href="assets/css/main.css" />
    <style>
      /* Style for the main simulator tabs */
      .simulator-tabs {
        list-style: none;
        padding: 0;
        margin: 0 0 10px 0;
        border-bottom: 1px solid #ccc;
        display: flex;
      }
      .simulator-tabs li {
        margin-right: 5px;
      }
      .simulator-tabs a {
        display: block;
        padding: 8px 15px;
        background: #eee;
        border: 1px solid #ccc;
        border-bottom: none;
        text-decoration: none;
        color: #333;
        border-radius: 5px 5px 0 0;
      }
      .simulator-tabs a.active {
        background: #fff;
        border-bottom: 1px solid #fff; /* Cover the main border */
        position: relative;
        top: 1px; /* Align with content border */
      }
      .simulator-instance {
        border: 1px solid #ccc;
        padding: 15px;
        margin-top: -1px; /* Overlap with tab border */
      }
      /* Style for inner tabs content */
      .inner-content {
        display: none;
      }
      .inner-content.active {
        display: block;
      }
      /* Per-connector control panel */
      .connector-panel {
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 8px;
        margin: 6px 0;
        background: #fafafa;
      }
      .connector-panel strong {
        display: inline-block;
        margin-bottom: 4px;
        color: #222a45;
      }
    </style>
  </head>
  <body>
    <!-- Main Tabs Container -->
    <ul id="simulator-tabs" class="simulator-tabs">
      <!-- Tabs will be generated here by JS -->
    </ul>

    <!-- Container for Simulator Instances -->
    <div id="simulator-container">
      <!-- Simulator content panes will be generated here by JS -->
    </div>

    <!-- Global Time Display (Optional) -->
    <div id="root_time" style="margin-top: 20px; text-align: center"></div>

    <script
      src="https://code.jquery.com/jquery-3.3.1.min.js"
      integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
      crossorigin="anonymous"
    ></script>

    <script type="text/babel">
      // Keep the React clock if desired - it's independent
      function tick() {
        const element = (
          <div>
            <p>Time on local machine: {new Date().toLocaleTimeString()}</p>
          </div>
        );
        ReactDOM.render(element, document.getElementById("root_time"));
      }
      setInterval(tick, 1000);
    </script>

    <script>
      // =============================================
      // Simulator Class Definition (Multi-Connector)
      // =============================================
      // Each Simulator instance models ONE OCPP 1.6J Charge Point (one
      // WebSocket connection / one Charge Point Id) that exposes TWO physical
      // connectors. Connector 1 and Connector 2 each maintain their own
      // transaction, meter-value stream, status and indicator, and can charge
      // independently and simultaneously over the single shared connection.
      class Simulator {
        constructor(id, containerElement) {
          this.id = id; // e.g., 1, 2, 3, 4
          this.container = containerElement; // The div holding this simulator's UI
          this.CONNECTOR_IDS = [1, 2]; // Two physical connectors per charge point

          this.config = {}; // Shared charge-point level settings
          this.state = {
            websocket: null,
            isConnected: false,
            heartbeatIntervalId: null,
            messageCounter: 0, // Simple counter for unique message IDs
            // Maps an outgoing OCPP messageId -> { action, connectorId } so that
            // CallResult / CallError responses are routed to the correct connector.
            pendingRequests: {},
            // --- Reconnection State ---
            reconnectAttempts: 0,
            maxReconnectAttempts: 5,
            reconnectTimerId: null,
            reconnectBaseDelay: 2000, // ms, initial delay
          };
          this.connectors = {}; // Per-connector state, keyed by connectorId
          this.uiElements = {}; // Shared DOM element references

          this._initConnectors();
          this._bindUIElements();
          this.loadConfigFromUI(); // Load initial values from HTML
          this._bindUIEvents();
          this.CONNECTOR_IDS.forEach((cid) => this.updateIndicator(cid, "red")); // Start disconnected
          this.loadPersistedState(); // Check localStorage on initialization
          this.CONNECTOR_IDS.forEach((cid) => this.updateTransactionsUI(cid));
        }

        // --- Setup Helpers ---

        _initConnectors() {
          this.CONNECTOR_IDS.forEach((cid) => {
            this.connectors[cid] = {
              id: cid,
              config: { idTag: "", statusNotification: "Available" },
              currentTransactionId: null,
              transactionIdToStop: null,
              meterValuesArr: null,
              meterValueIndex: 0,
              meterValueIntervalId: null,
              activeTransactions: [], // Store transaction IDs for display
              pendingStopConfirmationForTxId: null,
              isResuming: false, // Flag set when persisted state was loaded
              ui: {}, // Per-connector DOM references
            };
          });
        }

        _generateUniqueId() {
          return `msg-${this.id}-${Date.now()}-${this.state.messageCounter++}`;
        }

        _clearReconnectAttempts() {
          if (this.state.reconnectTimerId) {
            clearTimeout(this.state.reconnectTimerId);
            this.state.reconnectTimerId = null;
          }
          this.state.reconnectAttempts = 0;
        }

        _attemptReconnect() {
          if (this.state.reconnectAttempts < this.state.maxReconnectAttempts) {
            this.state.reconnectAttempts++;
            const delay =
              this.state.reconnectBaseDelay * Math.pow(2, this.state.reconnectAttempts - 1);
            this.log(
              `Connection lost/failed. Attempting to reconnect in ${delay / 1000}s (Attempt ${
                this.state.reconnectAttempts
              }/${this.state.maxReconnectAttempts})...`
            );
            this.updateAllIndicators("blue"); // Show connecting
            this.uiElements.connectButton.textContent = `Reconnecting (${this.state.reconnectAttempts}/${this.state.maxReconnectAttempts})...`;
            this.uiElements.connectButton.disabled = true;
            this.state.reconnectTimerId = setTimeout(() => {
              this.log(`Reconnection attempt ${this.state.reconnectAttempts}...`);
              this.connect(true);
            }, delay);
          } else {
            this.log(
              `Max reconnection attempts (${this.state.maxReconnectAttempts}) reached. Staying disconnected.`
            );
            this.updateAllIndicators("red");
            this.uiElements.connectButton.textContent = "Connect";
            this.uiElements.connectButton.disabled = false;
            if (this.state.reconnectTimerId) {
              clearTimeout(this.state.reconnectTimerId);
              this.state.reconnectTimerId = null;
            }
          }
        }

        _bindUIElements() {
          const q = (sel) => this.container.querySelector(sel);

          // --- Shared (charge-point level) controls ---
          this.uiElements.connectButton = q(`#connect-${this.id}`);
          this.uiElements.heartbeatButton = q(`#heartbeat-${this.id}`);
          this.uiElements.dataTransferButton = q(`#data_transfer-${this.id}`);

          // --- Shared settings inputs ---
          this.uiElements.endpointInput = q(`#endp-${this.id}`);
          this.uiElements.cpIdInput = q(`#CP-${this.id}`);
          this.uiElements.vendorInput = q(`#chargePointVendor-${this.id}`);
          this.uiElements.modelInput = q(`#chargePointModel-${this.id}`);
          this.uiElements.meterNumMessagesInput = q(`#meterValuesNumberOfMessages-${this.id}`);
          this.uiElements.meterIntervalInput = q(`#meterValueSampleIntervalInSeconds-${this.id}`);
          this.uiElements.minSocInput = q(`#minSoc-${this.id}`);
          this.uiElements.maxSocInput = q(`#maxSoc-${this.id}`);
          this.uiElements.minEnergyInput = q(`#minEnergy-${this.id}`);
          this.uiElements.maxEnergyInput = q(`#maxEnergy-${this.id}`);
          this.uiElements.avPowerInput = q(`#avPower-${this.id}`);
          this.uiElements.avCurrentInput = q(`#avCurrent-${this.id}`);
          this.uiElements.dataTransferInput = q(`#datatrasfer-${this.id}`);
          this.uiElements.logArea = q(`#console-${this.id}`);

          // --- Per-connector controls + indicators ---
          this.CONNECTOR_IDS.forEach((cid) => {
            const ui = this.connectors[cid].ui;
            ui.authorizeButton = q(`#send-${this.id}-${cid}`);
            ui.startButton = q(`#start-${this.id}-${cid}`);
            ui.stopButton = q(`#stop-${this.id}-${cid}`);
            ui.statusButton = q(`#status-${this.id}-${cid}`);
            ui.startMeterValuesButton = q(`#start-meter-values-${this.id}-${cid}`);
            ui.resumeMeterValuesButton = q(`#resume-meter-values-${this.id}-${cid}`);
            ui.idTagInput = q(`#idTag-${this.id}-${cid}`);
            ui.transToStpInput = q(`#TransToStp-${this.id}-${cid}`);
            ui.statusNotificationInput = q(`#statusNotification-${this.id}-${cid}`);
            ui.transactionsArea = q(`#transactions-${this.id}-${cid}`);
            ui.redIndicator = q(`#red-${this.id}-${cid}`);
            ui.greenIndicator = q(`#green-${this.id}-${cid}`);
            ui.yellowIndicator = q(`#yellow-${this.id}-${cid}`);
            ui.blueIndicator = q(`#blue-${this.id}-${cid}`);
          });
        }

        _bindUIEvents() {
          // Shared controls
          this.uiElements.connectButton.addEventListener("click", () => this.connect());
          this.uiElements.heartbeatButton.addEventListener("click", () => this.sendHeartbeat());
          this.uiElements.dataTransferButton.addEventListener("click", () =>
            this.sendDataTransfer()
          );

          // Per-connector controls
          this.CONNECTOR_IDS.forEach((cid) => {
            const ui = this.connectors[cid].ui;
            ui.authorizeButton.addEventListener("click", () => this.authorize(cid));
            ui.startButton.addEventListener("click", () => this.startTransaction(cid));
            ui.stopButton.addEventListener("click", () => this.stopTransaction(cid));
            ui.statusButton.addEventListener("click", () =>
              this.sendStatusNotificationFromInput(cid)
            );
            ui.startMeterValuesButton.addEventListener("click", () =>
              this.startSendingMeterValues(cid, false)
            );
            ui.resumeMeterValuesButton.addEventListener("click", () =>
              this.startSendingMeterValues(cid, true)
            );
          });

          // Update config object when inputs change
          const inputs = this.container.querySelectorAll('input[type="text"]');
          inputs.forEach((input) => {
            input.addEventListener("change", () => this.loadConfigFromUI());
          });
        }

        _getPersistenceKey() {
          const cpId = this.config.chargePointId;
          return cpId ? `simulatorState_${cpId}` : null;
        }

        // --- Per-connector helpers ---

        _stopMeterInterval(connectorId) {
          const c = this.connectors[connectorId];
          if (c && c.meterValueIntervalId !== null) {
            clearInterval(c.meterValueIntervalId);
            c.meterValueIntervalId = null;
          }
        }

        _clearConnectorTransaction(connectorId) {
          const c = this.connectors[connectorId];
          if (!c) return;
          c.currentTransactionId = null;
          c.meterValuesArr = null;
          c.meterValueIndex = 0;
          this._stopMeterInterval(connectorId);
          c.transactionIdToStop = null;
          if (c.ui.transToStpInput) c.ui.transToStpInput.value = "";
        }

        _anyActiveTransaction() {
          return this.CONNECTOR_IDS.some((cid) => this.connectors[cid].currentTransactionId);
        }

        // --- Public Methods ---

        log(message) {
          console.log(`[Sim ${this.id}] ${message}`);
          const li = document.createElement("li");
          li.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
          this.uiElements.logArea.appendChild(li);
          this.uiElements.logArea.scrollTop = this.uiElements.logArea.scrollHeight;
        }

        updateIndicator(connectorId, color) {
          const c = this.connectors[connectorId];
          if (!c) return;
          ["red", "green", "yellow", "blue"].forEach((col) => {
            const el = c.ui[`${col}Indicator`];
            if (el) el.style.display = "none";
          });
          const target = c.ui[`${color}Indicator`];
          if (target) target.style.display = "inline-block";
        }

        updateAllIndicators(color) {
          this.CONNECTOR_IDS.forEach((cid) => this.updateIndicator(cid, color));
        }

        loadConfigFromUI() {
          // Shared, charge-point level configuration
          this.config = {
            endpointUrl: this.uiElements.endpointInput.value.trim(),
            chargePointId: this.uiElements.cpIdInput.value.trim(),
            chargePointVendor: this.uiElements.vendorInput.value.trim(),
            chargePointModel: this.uiElements.modelInput.value.trim(),
            meterNumMessages: parseInt(this.uiElements.meterNumMessagesInput.value) || 100,
            meterSampleInterval: parseInt(this.uiElements.meterIntervalInput.value) || 10,
            minSoc: parseInt(this.uiElements.minSocInput.value) || 3,
            maxSoc: parseInt(this.uiElements.maxSocInput.value) || 100,
            minEnergy: parseInt(this.uiElements.minEnergyInput.value) || 0,
            maxEnergy: parseInt(this.uiElements.maxEnergyInput.value) || 20,
            avPower: parseInt(this.uiElements.avPowerInput.value) || 7000,
            avCurrent: parseInt(this.uiElements.avCurrentInput.value) || 21,
            dataTransferData: this.uiElements.dataTransferInput
              ? this.uiElements.dataTransferInput.value.trim()
              : "",
          };

          // Per-connector configuration
          this.CONNECTOR_IDS.forEach((cid) => {
            const c = this.connectors[cid];
            c.config.idTag = c.ui.idTagInput.value.trim();
            c.config.statusNotification =
              c.ui.statusNotificationInput.value.trim() || "Available";
            const stp = parseInt(c.ui.transToStpInput.value);
            c.transactionIdToStop = isNaN(stp) ? null : stp;
            // If the stop field is empty but a transaction is active, default to it
            if (!c.transactionIdToStop && c.currentTransactionId) {
              c.transactionIdToStop = c.currentTransactionId;
              c.ui.transToStpInput.value = c.currentTransactionId;
            }
          });
        }

        // Resolve a named field from either the connector's config or the shared
        // config, so validateFields can work for both scopes.
        _resolveField(connectorId, fieldName) {
          if (fieldName === "connectorId") return connectorId;
          const c = connectorId != null ? this.connectors[connectorId] : null;
          if (c && c.config && fieldName in c.config) return c.config[fieldName];
          return this.config[fieldName];
        }

        validateFields(connectorId, fieldNames) {
          this.loadConfigFromUI(); // Ensure config is up-to-date
          const missing = [];
          fieldNames.forEach((fieldName) => {
            const val = this._resolveField(connectorId, fieldName);
            if (!val && val !== 0) {
              const readableName = fieldName
                .replace(/([A-Z])/g, " $1")
                .replace(/^./, (str) => str.toUpperCase());
              missing.push(readableName);
            }
          });
          if (missing.length > 0) {
            const where = connectorId != null ? ` (Connector ${connectorId})` : "";
            alert(
              `Simulator ${this.id}${where}: Please fill the following fields: ${missing.join(
                ", "
              )}.`
            );
            return false;
          }
          return true;
        }

        // --- Persistence Methods ---

        loadPersistedState() {
          const key = this._getPersistenceKey();
          this.CONNECTOR_IDS.forEach((cid) => {
            this.connectors[cid].activeTransactions = [];
          });
          if (!key) return;

          const raw = localStorage.getItem(key);
          if (!raw) {
            this.log("No persisted state found.");
            return;
          }
          try {
            const parsed = JSON.parse(raw);
            const conns = parsed.connectors || {};
            let anyLoaded = false;
            this.CONNECTOR_IDS.forEach((cid) => {
              const saved = conns[cid] || conns[String(cid)];
              const c = this.connectors[cid];
              if (saved && saved.currentTransactionId) {
                c.currentTransactionId = saved.currentTransactionId;
                c.meterValuesArr = saved.meterValuesArr;
                c.meterValueIndex = saved.meterValueIndex || 0;
                c.activeTransactions = saved.activeTransactions || [saved.currentTransactionId];
                c.isResuming = true;
                anyLoaded = true;
                this.log(
                  `Loaded persisted state for connector ${cid}: Tx ${c.currentTransactionId}, next meter index ${c.meterValueIndex}`
                );
              } else {
                c.activeTransactions = [];
              }
            });
            if (parsed.meterSampleInterval) {
              this.config.meterSampleInterval = parsed.meterSampleInterval;
              this.uiElements.meterIntervalInput.value = parsed.meterSampleInterval;
            }
            if (!anyLoaded) this.log("No active transaction found in persisted state.");
          } catch (e) {
            this.log(`Error parsing persisted state: ${e}. Clearing.`);
            localStorage.removeItem(key);
          }
        }

        persistState() {
          const key = this._getPersistenceKey();
          if (!key) return;

          const data = {
            connectors: {},
            meterSampleInterval: this.config.meterSampleInterval,
          };
          let anyActive = false;
          this.CONNECTOR_IDS.forEach((cid) => {
            const c = this.connectors[cid];
            if (c.currentTransactionId && c.meterValuesArr) {
              anyActive = true;
              data.connectors[cid] = {
                currentTransactionId: c.currentTransactionId,
                meterValuesArr: c.meterValuesArr,
                meterValueIndex: c.meterValueIndex,
                activeTransactions: c.activeTransactions,
              };
            }
          });

          if (anyActive) {
            localStorage.setItem(key, JSON.stringify(data));
            this.log(`Persisted state for ${Object.keys(data.connectors).length} active connector(s).`);
          } else {
            this.clearPersistedState();
          }
        }

        clearPersistedState() {
          const key = this._getPersistenceKey();
          if (key && localStorage.getItem(key)) {
            localStorage.removeItem(key);
            this.log(`Cleared persisted state for CP ${this.config.chargePointId}`);
          }
        }

        // --- WebSocket and OCPP Methods ---

        connect(isReconnectAttempt = false) {
          if (!isReconnectAttempt) {
            this._clearReconnectAttempts();
          }

          this.loadConfigFromUI();
          if (
            !this.validateFields(null, [
              "endpointUrl",
              "chargePointId",
              "chargePointVendor",
              "chargePointModel",
            ])
          ) {
            return;
          }

          if (this.state.websocket) {
            this.log("Disconnecting (user initiated)...");
            this.disconnect(3001); // User initiated disconnect code
            return;
          }

          // Load persisted state again right before connecting (CP Id may have changed)
          this.loadPersistedState();
          this.CONNECTOR_IDS.forEach((cid) => this.updateTransactionsUI(cid));

          const url = `${this.config.endpointUrl}${this.config.chargePointId}`;
          this.log(`Connecting to ${url}...`);
          this.updateAllIndicators("blue"); // Connecting status
          this.uiElements.connectButton.textContent = "Connecting...";
          this.uiElements.connectButton.disabled = true;

          try {
            this.state.websocket = new WebSocket(url, ["ocpp1.6", "ocpp1.5"]);
          } catch (e) {
            this.log(`Error creating WebSocket: ${e}`);
            this.updateAllIndicators("red");
            this.uiElements.connectButton.textContent = "Connect";
            this.uiElements.connectButton.disabled = false;
            return;
          }

          this.state.websocket.onopen = () => {
            this.log("WebSocket Opened");
            this._clearReconnectAttempts();
            this.state.isConnected = true;
            this.uiElements.connectButton.textContent = "Disconnect";
            this.uiElements.connectButton.disabled = false;
            this.updateAllIndicators("yellow"); // Connected, waiting for Boot response
            this.sendBootNotification();
          };

          this.state.websocket.onmessage = (event) => {
            this.handleMessage(event.data);
          };

          this.state.websocket.onclose = (event) => {
            this.log(`WebSocket Closed: Code=${event.code}, Reason=${event.reason || "N/A"}`);
            this.state.isConnected = false;
            this.state.websocket = null;
            clearInterval(this.state.heartbeatIntervalId);
            this.state.heartbeatIntervalId = null;
            this.state.pendingRequests = {}; // Drop in-flight request correlation

            // --- Preemptive check for any connector with a pending StopTransaction ---
            let handledPendingStop = false;
            this.CONNECTOR_IDS.forEach((cid) => {
              const c = this.connectors[cid];
              if (
                c.pendingStopConfirmationForTxId &&
                c.pendingStopConfirmationForTxId === c.currentTransactionId
              ) {
                this.log(
                  `Disconnected while StopTransaction was pending for Tx ${c.pendingStopConfirmationForTxId} (Connector ${cid}). Clearing local and persisted state for this transaction.`
                );
                const pendingTxId = c.pendingStopConfirmationForTxId;
                this.removeTransactionFromList(cid, pendingTxId);
                this._clearConnectorTransaction(cid);
                c.pendingStopConfirmationForTxId = null;
                handledPendingStop = true;
              }
            });

            // Stop all meter intervals
            this.CONNECTOR_IDS.forEach((cid) => this._stopMeterInterval(cid));

            if (handledPendingStop) {
              this.persistState(); // Persist remaining active connectors (or clears if none)
              this.updateAllIndicators("red");
              this.uiElements.connectButton.textContent = "Connect";
              this.uiElements.connectButton.disabled = false;
              this._clearReconnectAttempts();
              return;
            }

            // Special codes for controlled disconnections
            const controlledDisconnectCodes = [1000, 3001, 3002];
            const isControlledDisconnect = controlledDisconnectCodes.includes(event.code);

            if (isControlledDisconnect) {
              this.log("Controlled disconnect. Auto-reconnection will not be attempted.");
              this._clearReconnectAttempts();
              if (this._anyActiveTransaction() && event.code !== 3002) {
                this.persistState();
              }
              this.updateAllIndicators("red");
              this.uiElements.connectButton.textContent = "Connect";
              this.uiElements.connectButton.disabled = false;
            } else {
              this.log("Unexpected disconnect or initial connection failure.");
              if (this._anyActiveTransaction()) {
                this.persistState();
                this.log("Persisted active transaction state due to unexpected disconnect.");
              } else {
                this.log("No active transaction to persist for unexpected disconnect.");
              }
              this._attemptReconnect();
            }

            // Fallback UI update
            if (
              this.state.reconnectAttempts >= this.state.maxReconnectAttempts &&
              !this.state.reconnectTimerId
            ) {
              this.updateAllIndicators("red");
              this.uiElements.connectButton.textContent = "Connect";
              this.uiElements.connectButton.disabled = false;
            } else if (isControlledDisconnect) {
              this.updateAllIndicators("red");
              this.uiElements.connectButton.textContent = "Connect";
              this.uiElements.connectButton.disabled = false;
            }
          };

          this.state.websocket.onerror = (event) => {
            this.log(`WebSocket Error: ${event.type || "Unknown error"}`);
            if (
              !this.state.isConnected &&
              this.state.reconnectAttempts === 0 &&
              !this.state.reconnectTimerId
            ) {
              this.updateAllIndicators("red");
              this.uiElements.connectButton.textContent = "Connect";
              this.uiElements.connectButton.disabled = false;
            }
          };
        }

        disconnect(code = 1000) {
          this._clearReconnectAttempts();
          if (this.state.websocket) {
            this.CONNECTOR_IDS.forEach((cid) => this._stopMeterInterval(cid));
            if (this._anyActiveTransaction()) {
              this.persistState();
            }
            this.state.websocket.close(code);
          } else {
            this.state.isConnected = false;
            this.uiElements.connectButton.textContent = "Connect";
            this.uiElements.connectButton.disabled = false;
            this.updateAllIndicators("red");
            clearInterval(this.state.heartbeatIntervalId);
            this.state.heartbeatIntervalId = null;
            this.CONNECTOR_IDS.forEach((cid) => this._stopMeterInterval(cid));
          }
        }

        sendRequest(action, payload, connectorId = null) {
          if (!this.state.websocket || this.state.websocket.readyState !== WebSocket.OPEN) {
            this.log(`Cannot send ${action}: WebSocket not open.`);
            return false;
          }
          const messageId = this._generateUniqueId();
          const message = [2, messageId, action, payload];
          const jsonMessage = JSON.stringify(message);
          this.log(`TX${connectorId ? ` [C${connectorId}]` : ""}: ${jsonMessage}`);
          // Record the action + connector so the response can be routed correctly.
          this.state.pendingRequests[messageId] = { action, connectorId };
          this.state.websocket.send(jsonMessage);
          return true;
        }

        sendResponse(messageId, payload) {
          if (!this.state.websocket || this.state.websocket.readyState !== WebSocket.OPEN) {
            this.log(`Cannot send response: WebSocket not open.`);
            return;
          }
          const message = [3, messageId, payload];
          const jsonMessage = JSON.stringify(message);
          this.log(`TX Response: ${jsonMessage}`);
          this.state.websocket.send(jsonMessage);
        }

        sendError(messageId, errorCode, errorDescription = "", errorDetails = {}) {
          if (!this.state.websocket || this.state.websocket.readyState !== WebSocket.OPEN) {
            this.log(`Cannot send error: WebSocket not open.`);
            return;
          }
          const message = [4, messageId, errorCode, errorDescription, errorDetails];
          const jsonMessage = JSON.stringify(message);
          this.log(`TX Error: ${jsonMessage}`);
          this.state.websocket.send(jsonMessage);
        }

        handleMessage(jsonData) {
          this.log(`RX: ${jsonData}`);
          try {
            const msg = JSON.parse(jsonData);
            const messageTypeId = msg[0];
            const messageId = msg[1];

            if (messageTypeId === 3) {
              // CallResult (Response to our request) - route by messageId
              const payload = msg[2];
              const pending = this.state.pendingRequests[messageId];
              delete this.state.pendingRequests[messageId];
              const action = pending ? pending.action : null;
              const connectorId = pending ? pending.connectorId : null;
              this.handleCallResult(action, messageId, payload, connectorId);
            } else if (messageTypeId === 2) {
              // Call (Command from server)
              const action = msg[2];
              const payload = msg[3];
              this.handleCall(messageId, action, payload);
            } else if (messageTypeId === 4) {
              // CallError (Error response from server) - route by messageId
              const errorCode = msg[2];
              const errorDescription = msg[3];
              const errorDetails = msg[4];
              const pending = this.state.pendingRequests[messageId];
              delete this.state.pendingRequests[messageId];
              const action = pending ? pending.action : null;
              const connectorId = pending ? pending.connectorId : null;
              this.handleCallError(
                action,
                messageId,
                errorCode,
                errorDescription,
                errorDetails,
                connectorId
              );
            }
          } catch (e) {
            this.log(`Error processing message: ${e}`);
            this.log(`Raw data: ${jsonData}`);
          }
        }

        handleCallResult(action, messageId, payload, connectorId) {
          this.log(
            `Response received for ${action || "Unknown"}${
              connectorId ? ` [C${connectorId}]` : ""
            } (ID: ${messageId}): ${JSON.stringify(payload)}`
          );
          switch (action) {
            case "BootNotification":
              if (payload.status === "Accepted") {
                const interval = payload.interval;
                this.log(
                  `Boot successful. Heartbeat interval: ${interval}s. Current time: ${payload.currentTime}`
                );
                this.startHeartbeat(interval * 1000);

                // For each connector, either resume or send initial status
                this.CONNECTOR_IDS.forEach((cid) => {
                  const c = this.connectors[cid];
                  if (c.isResuming && c.currentTransactionId && c.meterValuesArr) {
                    this.log(
                      `Resuming transaction ${c.currentTransactionId} on connector ${cid} from index ${c.meterValueIndex}`
                    );
                    this.sendStatusNotification(cid, "Charging", "NoError", false);
                    this.updateIndicator(cid, "green");
                    this.log(
                      `Connector ${cid}: resumed charging state. Use 'Resume Meter Values' to continue sending.`
                    );
                  } else {
                    this.sendStatusNotification(
                      cid,
                      c.config.statusNotification || "Available",
                      "NoError",
                      false
                    );
                    this.updateIndicator(cid, "yellow");
                  }
                  c.isResuming = false;
                });
              } else {
                this.log(`BootNotification rejected: ${payload.status}.`);
                this.disconnect();
              }
              break;

            case "Authorize":
              this.log(
                `Authorization status${connectorId ? ` [C${connectorId}]` : ""}: ${
                  payload.idTagInfo ? payload.idTagInfo.status : "Unknown"
                }`
              );
              break;

            case "StartTransaction": {
              const c = this.connectors[connectorId];
              if (!c) {
                this.log(`StartTransaction result for unknown connector ${connectorId}.`);
                break;
              }
              if (payload.idTagInfo && payload.idTagInfo.status === "Accepted") {
                c.currentTransactionId = payload.transactionId;
                this.log(
                  `Transaction ${c.currentTransactionId} started on connector ${connectorId}.`
                );
                c.ui.transToStpInput.value = c.currentTransactionId;
                c.transactionIdToStop = c.currentTransactionId;
                this.addTransactionToList(connectorId, c.currentTransactionId);
                // OCPP 1.6 status transition: Preparing -> Charging (updates indicator)
                this.sendStatusNotification(connectorId, "Charging");
                this.log(
                  `Connector ${connectorId}: transaction started. Use 'Start Meter Values' to begin sending.`
                );
              } else {
                const reason = payload.idTagInfo ? payload.idTagInfo.status : "Rejected by server";
                this.log(`StartTransaction failed on connector ${connectorId}: ${reason}`);
                // Rejected start returns the connector to Available (Preparing -> Available)
                this.sendStatusNotification(connectorId, "Available");
              }
              break;
            }

            case "StopTransaction": {
              const c = this.connectors[connectorId];
              if (!c) {
                this.log(`StopTransaction result for unknown connector ${connectorId}.`);
                break;
              }
              const stoppedTxId = c.currentTransactionId;
              this.log(
                `StopTransaction confirmed for Tx ${stoppedTxId} on connector ${connectorId}.`
              );
              this.removeTransactionFromList(connectorId, stoppedTxId);
              this._clearConnectorTransaction(connectorId);
              this.persistState();
              this.sendStatusNotification(connectorId, "Finishing");
              setTimeout(() => this.sendStatusNotification(connectorId, "Available"), 2000);
              this.updateIndicator(connectorId, "yellow");
              c.pendingStopConfirmationForTxId = null;
              break;
            }

            case "Heartbeat":
              this.log(`Heartbeat acknowledged. Server time: ${payload.currentTime}`);
              break;

            case "MeterValues":
              this.log(`MeterValues acknowledged${connectorId ? ` [C${connectorId}]` : ""}.`);
              break;

            case "StatusNotification":
              this.log(
                `StatusNotification acknowledged${connectorId ? ` [C${connectorId}]` : ""}.`
              );
              break;

            case "DataTransfer":
              this.log(
                `DataTransfer acknowledged. Status: ${payload.status}, Data: ${payload.data || ""}`
              );
              break;

            default:
              this.log(`Received result for unhandled action: ${action}`);
              break;
          }
        }

        handleCallError(action, messageId, errorCode, errorDescription, errorDetails, connectorId) {
          this.log(
            `Error response received for ${action || "Unknown Action"}${
              connectorId ? ` [C${connectorId}]` : ""
            } (ID: ${messageId}): ${errorCode} - ${errorDescription} ${JSON.stringify(
              errorDetails
            )}`
          );
          if (action === "StartTransaction" && connectorId) {
            this.updateIndicator(connectorId, this.state.isConnected ? "yellow" : "red");
          }
          if (action === "StopTransaction" && connectorId) {
            const c = this.connectors[connectorId];
            if (c) c.pendingStopConfirmationForTxId = null;
            this.log(`Cleared pending stop flag due to error for connector ${connectorId}.`);
          }
        }

        handleCall(messageId, action, payload) {
          this.log(`Command received: ${action}, Payload: ${JSON.stringify(payload)}`);
          switch (action) {
            case "RemoteStartTransaction": {
              // Determine target connector: use the requested one, otherwise the
              // first idle connector.
              let targetConnector =
                payload.connectorId && payload.connectorId > 0 ? payload.connectorId : null;
              if (targetConnector === null) {
                targetConnector =
                  this.CONNECTOR_IDS.find((cid) => !this.connectors[cid].currentTransactionId) ||
                  this.CONNECTOR_IDS[0];
              }
              const c = this.connectors[targetConnector];
              if (c && !c.currentTransactionId && payload.idTag) {
                this.log(
                  `Accepting RemoteStartTransaction for connector ${targetConnector} with idTag ${payload.idTag}`
                );
                this.sendResponse(messageId, { status: "Accepted" });
                // Start locally using the CSMS-provided idTag. The idTag is applied
                // to the connector (config + UI) for the whole session, and
                // startTransaction drives the Preparing -> Charging status flow.
                this.startTransaction(targetConnector, payload.idTag);
              } else {
                const reason = !c
                  ? "invalid connector"
                  : c.currentTransactionId
                  ? "connector busy"
                  : "missing idTag";
                this.log(
                  `Rejecting RemoteStartTransaction (connector ${targetConnector}): ${reason}.`
                );
                this.sendResponse(messageId, { status: "Rejected" });
              }
              break;
            }

            case "RemoteStopTransaction": {
              const txIdToStop = payload.transactionId;
              const cid = this.CONNECTOR_IDS.find(
                (id) => this.connectors[id].currentTransactionId === txIdToStop
              );
              if (cid) {
                this.log(
                  `Accepting RemoteStopTransaction for Tx ${txIdToStop} on connector ${cid}.`
                );
                this.sendResponse(messageId, { status: "Accepted" });
                this.stopTransaction(cid, true);
              } else {
                this.log(
                  `Rejecting RemoteStopTransaction: Tx ID ${txIdToStop} not active on any connector.`
                );
                this.sendResponse(messageId, { status: "Rejected" });
              }
              break;
            }

            case "Reset":
              this.log(`Processing Reset command (Type: ${payload.type})`);
              this.sendResponse(messageId, { status: "Accepted" });
              setTimeout(() => {
                this.log(`Performing ${payload.type} reset... disconnecting.`);
                if (payload.type === "Hard") {
                  this.clearPersistedState();
                }
                this.disconnect(3002);
              }, 1000);
              break;

            case "ChangeAvailability": {
              this.log(
                `Processing ChangeAvailability for Connector ${payload.connectorId} to ${payload.type}`
              );
              // connectorId 0 addresses the whole charge point (all connectors)
              const targets =
                payload.connectorId === 0
                  ? this.CONNECTOR_IDS
                  : this.connectors[payload.connectorId]
                  ? [payload.connectorId]
                  : [];
              if (targets.length > 0) {
                this.sendResponse(messageId, { status: "Accepted" });
                const newStatus = payload.type === "Inoperative" ? "Unavailable" : "Available";
                targets.forEach((cid) => {
                  const c = this.connectors[cid];
                  c.config.statusNotification = newStatus;
                  c.ui.statusNotificationInput.value = newStatus;
                  if (!c.currentTransactionId || newStatus === "Unavailable") {
                    this.sendStatusNotification(cid, newStatus);
                  } else {
                    this.log(
                      `Connector ${cid}: availability changed to ${newStatus}, but currently charging. StatusNotification not sent.`
                    );
                  }
                });
              } else {
                this.sendResponse(messageId, { status: "Rejected" }); // Unknown connector
              }
              break;
            }

            case "SetChargingProfile":
              this.log(`Processing SetChargingProfile for Connector ${payload.connectorId}`);
              this.sendResponse(messageId, { status: "Accepted" });
              break;

            case "UnlockConnector":
              this.log(`Processing UnlockConnector for Connector ${payload.connectorId}`);
              this.sendResponse(messageId, { status: "Unlocked" });
              break;

            case "ChangeConfiguration":
              this.log(
                `Processing ChangeConfiguration for Key: ${payload.key}, Value: ${payload.value}`
              );
              this.sendResponse(messageId, { status: "Accepted" });
              break;

            case "ClearCache":
              this.log(`Processing ClearCache command`);
              this.sendResponse(messageId, { status: "Accepted" });
              break;

            case "GetConfiguration": {
              this.log(`Processing GetConfiguration command`);
              const configKeys = payload.key || [];
              const configurationKey = [
                { key: "HeartbeatInterval", readonly: false, value: "60" },
                { key: "MeterValueSampleInterval", readonly: false, value: "10" },
                { key: "NumberOfConnectors", readonly: true, value: "2" },
              ];
              let filteredKeys = configurationKey;
              if (configKeys.length > 0) {
                filteredKeys = configurationKey.filter((config) => configKeys.includes(config.key));
              }
              this.sendResponse(messageId, {
                configurationKey: filteredKeys,
                unknownKey: [],
              });
              break;
            }

            case "DataTransfer":
              this.log(
                `Processing DataTransfer - VendorId: ${payload.vendorId}, MessageId: ${
                  payload.messageId || "N/A"
                }`
              );
              this.sendResponse(messageId, {
                status: "Accepted",
                data: "Response from simulator",
              });
              break;

            case "GetLocalListVersion":
              this.log(`Processing GetLocalListVersion command`);
              this.sendResponse(messageId, { listVersion: 1 });
              break;

            case "SendLocalList":
              this.log(
                `Processing SendLocalList - Version: ${payload.listVersion}, UpdateType: ${payload.updateType}`
              );
              this.sendResponse(messageId, { status: "Accepted" });
              break;

            case "CancelReservation":
              this.log(`Processing CancelReservation for ReservationId: ${payload.reservationId}`);
              this.sendResponse(messageId, { status: "Accepted" });
              break;

            case "ReserveNow":
              this.log(
                `Processing ReserveNow - ConnectorId: ${payload.connectorId}, ExpiryDate: ${payload.expiryDate}, IdTag: ${payload.idTag}`
              );
              this.sendResponse(messageId, { status: "Accepted" });
              break;

            case "ClearChargingProfile":
              this.log(
                `Processing ClearChargingProfile - Id: ${payload.id || "All"}, ConnectorId: ${
                  payload.connectorId || "All"
                }`
              );
              this.sendResponse(messageId, { status: "Accepted" });
              break;

            case "GetCompositeSchedule":
              this.log(
                `Processing GetCompositeSchedule - ConnectorId: ${payload.connectorId}, Duration: ${payload.duration}`
              );
              this.sendResponse(messageId, {
                status: "Accepted",
                connectorId: payload.connectorId,
                scheduleStart: new Date().toISOString(),
                chargingSchedule: {
                  duration: payload.duration,
                  chargingRateUnit: "W",
                  chargingSchedulePeriod: [{ startPeriod: 0, limit: 7000 }],
                },
              });
              break;

            case "TriggerMessage":
              this.log(
                `Processing TriggerMessage - RequestedMessage: ${
                  payload.requestedMessage
                }, ConnectorId: ${payload.connectorId || "N/A"}`
              );
              this.sendResponse(messageId, { status: "Accepted" });

              setTimeout(() => {
                switch (payload.requestedMessage) {
                  case "BootNotification":
                    this.sendBootNotification();
                    break;
                  case "Heartbeat":
                    this.sendHeartbeat();
                    break;
                  case "StatusNotification": {
                    const cid =
                      payload.connectorId && this.connectors[payload.connectorId]
                        ? payload.connectorId
                        : null;
                    if (cid) {
                      this.sendStatusNotification(
                        cid,
                        this.connectors[cid].config.statusNotification || "Available"
                      );
                    } else {
                      this.CONNECTOR_IDS.forEach((c) =>
                        this.sendStatusNotification(
                          c,
                          this.connectors[c].config.statusNotification || "Available"
                        )
                      );
                    }
                    break;
                  }
                  case "MeterValues": {
                    const cid =
                      payload.connectorId && this.connectors[payload.connectorId]
                        ? payload.connectorId
                        : this.CONNECTOR_IDS.find(
                            (c) => this.connectors[c].currentTransactionId
                          );
                    if (cid && this.connectors[cid].currentTransactionId) {
                      this.startSendingMeterValues(cid, false);
                    } else {
                      this.log("Cannot trigger MeterValues: No active transaction");
                    }
                    break;
                  }
                  default:
                    this.log(`TriggerMessage: ${payload.requestedMessage} not implemented`);
                    break;
                }
              }, 500);
              break;

            case "GetDiagnostics": {
              this.log(`Processing GetDiagnostics - Location: ${payload.location}`);
              const fileName = `diagnostics_${this.config.chargePointId}_${Date.now()}.log`;
              this.sendResponse(messageId, { fileName: fileName });
              setTimeout(() => {
                this.log(`Starting diagnostics upload to ${payload.location}...`);
                this.sendDiagnosticsStatusNotification("Uploading");
                setTimeout(() => {
                  this.log(`Diagnostics upload completed: ${fileName}`);
                  this.sendDiagnosticsStatusNotification("Uploaded");
                }, 3000);
              }, 1000);
              break;
            }

            case "UpdateFirmware":
              this.log(
                `Processing UpdateFirmware - Location: ${payload.location}, RetrieveDate: ${payload.retrieveDate}`
              );
              this.sendResponse(messageId, {});
              setTimeout(() => {
                this.log("Firmware update completed (simulated)");
              }, 2000);
              break;

            default:
              this.log(`Unsupported command received: ${action}. Sending NotSupported.`);
              this.sendError(
                messageId,
                "NotSupported",
                `Command ${action} is not supported by this simulator.`
              );
              break;
          }
        }

        // --- OCPP Action Methods ---

        sendBootNotification() {
          const payload = {
            chargePointVendor: this.config.chargePointVendor,
            chargePointModel: this.config.chargePointModel,
            chargePointSerialNumber: `SIM-${this.id}-SN`,
            firmwareVersion: "1.0.0",
          };
          this.sendRequest("BootNotification", payload, null);
        }

        authorize(connectorId) {
          if (!this.validateFields(connectorId, ["idTag"])) return;
          const c = this.connectors[connectorId];
          this.sendRequest("Authorize", { idTag: c.config.idTag }, connectorId);
        }

        startTransaction(connectorId, idTagOverride = null) {
          const c = this.connectors[connectorId];
          // Apply an idTag supplied by the CSMS (RemoteStartTransaction) *before*
          // validation, so it is used for this transaction and shown in the UI
          // for the whole session (no transient revert).
          if (idTagOverride) {
            c.config.idTag = idTagOverride;
            c.ui.idTagInput.value = idTagOverride;
          }

          if (
            !this.validateFields(connectorId, [
              "connectorId",
              "idTag",
              "minEnergy",
              "meterNumMessages",
              "meterSampleInterval",
              "minSoc",
              "maxSoc",
              "maxEnergy",
              "avPower",
              "avCurrent",
            ])
          )
            return;

          if (c.currentTransactionId) {
            this.log(
              `Connector ${connectorId}: cannot start, Tx ${c.currentTransactionId} already active.`
            );
            alert(
              `Simulator ${this.id} (Connector ${connectorId}): Tx ${c.currentTransactionId} is already active.`
            );
            return;
          }

          // OCPP 1.6 status transition: the connector becomes Preparing before the
          // StartTransaction request is sent (Available -> Preparing).
          this.sendStatusNotification(connectorId, "Preparing");

          const payload = {
            connectorId: connectorId,
            idTag: c.config.idTag,
            timestamp: new Date().toISOString(),
            meterStart: this.config.minEnergy * 1000, // Convert kWh to Wh
          };
          this.sendRequest("StartTransaction", payload, connectorId);
        }

        stopTransaction(connectorId, isRemote = false) {
          this.loadConfigFromUI();
          const c = this.connectors[connectorId];
          const txIdToStop = c.transactionIdToStop || c.currentTransactionId;

          if (!txIdToStop) {
            this.log(
              `Connector ${connectorId}: No active transaction or Transaction ID specified to stop.`
            );
            alert(
              `Simulator ${this.id} (Connector ${connectorId}): Please specify a Transaction ID to stop, or start a transaction first.`
            );
            return;
          }

          if (c.pendingStopConfirmationForTxId === txIdToStop) {
            this.log(`StopTransaction for Tx ${txIdToStop} is already pending. Please wait.`);
            return;
          }

          if (c.currentTransactionId && txIdToStop !== c.currentTransactionId) {
            this.log(
              `Warning: Stopping Tx ${txIdToStop} but current active Tx on connector ${connectorId} is ${c.currentTransactionId}.`
            );
          }

          if (!this.validateFields(connectorId, ["idTag"])) return;

          if (txIdToStop === c.currentTransactionId) {
            this._stopMeterInterval(connectorId);
            this.log(
              `Connector ${connectorId}: Stopped sending MeterValues due to StopTransaction request.`
            );
          }

          const meterStopValue = this.calculateMeterStopValue(connectorId, txIdToStop);

          const payload = {
            transactionId: txIdToStop,
            idTag: c.config.idTag,
            timestamp: new Date().toISOString(),
            meterStop: meterStopValue,
            reason: isRemote ? "Remote" : "Local",
          };

          if (this.sendRequest("StopTransaction", payload, connectorId)) {
            this.log(
              `StopTransaction sent for Tx ${txIdToStop} (Connector ${connectorId}). Waiting for confirmation...`
            );
            c.pendingStopConfirmationForTxId = txIdToStop;
          }
          // Wait for the server's confirmation in handleCallResult('StopTransaction').
        }

        calculateMeterStopValue(connectorId, transactionId) {
          const c = this.connectors[connectorId];
          let stopValueKwh = 0;
          let sourceArr = null;
          let sourceIndex = 0;

          // Prioritize currently active transaction state for this connector
          if (transactionId === c.currentTransactionId && c.meterValuesArr) {
            sourceArr = c.meterValuesArr;
            sourceIndex = c.meterValueIndex;
            this.log(`Calculating stop value from active state: index ${sourceIndex}`);
          } else {
            // Otherwise try loading this connector's persisted state
            const key = this._getPersistenceKey();
            if (key) {
              const persisted = localStorage.getItem(key);
              if (persisted) {
                try {
                  const parsed = JSON.parse(persisted);
                  const saved =
                    (parsed.connectors || {})[connectorId] ||
                    (parsed.connectors || {})[String(connectorId)];
                  if (saved && saved.currentTransactionId === transactionId) {
                    sourceArr = saved.meterValuesArr;
                    sourceIndex = saved.meterValueIndex;
                    this.log(`Calculating stop value from persisted state: index ${sourceIndex}`);
                  }
                } catch (e) {
                  this.log(`Error reading persisted state for stop value calc: ${e}`);
                }
              }
            }
          }

          if (sourceArr && sourceIndex > 0) {
            const lastSentIndex = Math.max(0, sourceIndex - 1);
            if (lastSentIndex < sourceArr.length) {
              const energySample = sourceArr[lastSentIndex]?.meterValue?.find(
                (mv) => mv.sampledValue[0].measurand === "Energy.Active.Import.Register"
              );
              if (energySample) {
                stopValueKwh = parseFloat(energySample.sampledValue[0].value);
                this.log(`Last sent energy value: ${stopValueKwh} kWh at index ${lastSentIndex}`);
              } else {
                this.log(`Could not find energy measurand at index ${lastSentIndex}`);
              }
            } else {
              this.log(
                `Last sent index ${lastSentIndex} is out of bounds for meter array (length ${sourceArr.length})`
              );
            }
          } else if (sourceArr && sourceIndex === 0) {
            this.log("Stop requested before any meter values were sent. Using meterStart value.");
            stopValueKwh = this.config.minEnergy || 0;
          } else {
            this.log(
              "No meter values found for calculation. Using configured maxEnergy as fallback."
            );
            stopValueKwh = this.config.maxEnergy || 0;
          }

          stopValueKwh = Math.max(this.config.minEnergy || 0, stopValueKwh);
          this.log(`Calculated stop value: ${stopValueKwh} kWh`);
          return Math.round(stopValueKwh * 1000); // Convert kWh to Wh and round
        }

        sendHeartbeat() {
          this.sendRequest("Heartbeat", {}, null);
        }

        sendStatusNotification(
          connectorId,
          status = null,
          errorCode = "NoError",
          updateUiField = true
        ) {
          const c = this.connectors[connectorId];
          if (!c) return;
          const currentStatus = status || c.config.statusNotification;

          const payload = {
            connectorId: connectorId,
            status: currentStatus,
            errorCode: errorCode,
            timestamp: new Date().toISOString(),
          };
          if (this.sendRequest("StatusNotification", payload, connectorId)) {
            if (updateUiField) {
              c.ui.statusNotificationInput.value = currentStatus;
            }
            c.config.statusNotification = currentStatus;
            this._applyStatusIndicator(connectorId, currentStatus);
          }
        }

        // Maps an OCPP 1.6 connector status to the coloured indicator so the UI
        // reflects the connector's real state machine.
        _applyStatusIndicator(connectorId, status) {
          if (!this.state.isConnected) return;
          const map = {
            Available: "yellow",
            Preparing: "yellow",
            Charging: "green",
            SuspendedEV: "green",
            SuspendedEVSE: "green",
            Finishing: "yellow",
            Reserved: "yellow",
            Unavailable: "red",
            Faulted: "red",
          };
          this.updateIndicator(connectorId, map[status] || "yellow");
        }

        sendDiagnosticsStatusNotification(status) {
          this.sendRequest("DiagnosticsStatusNotification", { status: status }, null);
        }

        sendStatusNotificationFromInput(connectorId) {
          if (!this.validateFields(connectorId, ["statusNotification"])) return;
          const c = this.connectors[connectorId];
          this.sendStatusNotification(connectorId, c.config.statusNotification, "NoError");
        }

        sendDataTransfer() {
          if (!this.validateFields(null, ["dataTransferData"])) {
            alert(`Simulator ${this.id}: Please enter data to transfer.`);
            return;
          }
          const payload = {
            vendorId: "SimulatorVendor",
            data: this.config.dataTransferData,
          };
          this.sendRequest("DataTransfer", payload, null);
        }

        startHeartbeat(interval) {
          clearInterval(this.state.heartbeatIntervalId);
          if (interval > 0) {
            this.state.heartbeatIntervalId = setInterval(() => {
              this.sendHeartbeat();
            }, interval);
            this.log(`Heartbeat started every ${interval / 1000}s`);
          } else {
            this.log("Heartbeat interval is 0, heartbeat disabled.");
          }
        }

        startSendingMeterValues(connectorId, resume = false) {
          this.loadConfigFromUI();
          const c = this.connectors[connectorId];

          if (!this.state.isConnected) {
            this.log("Cannot send MeterValues: Not connected.");
            alert(`Simulator ${this.id}: Cannot send MeterValues, not connected.`);
            return;
          }

          if (!c.currentTransactionId) {
            this.log(`Connector ${connectorId}: Cannot send MeterValues: No active transaction ID.`);
            alert(`Simulator ${this.id} (Connector ${connectorId}): No active transaction.`);
            return;
          }

          if (c.meterValueIntervalId !== null) {
            this.log(`Connector ${connectorId}: MeterValues sending is already active.`);
            return;
          }

          if (
            !this.validateFields(connectorId, [
              "meterNumMessages",
              "meterSampleInterval",
              "minSoc",
              "maxSoc",
              "minEnergy",
              "maxEnergy",
              "avPower",
              "avCurrent",
            ])
          )
            return;

          // --- Decide whether to generate or use existing/persisted data ---
          let needsGeneration = false;
          if (resume) {
            if (
              c.meterValuesArr &&
              c.meterValuesArr.length > 0 &&
              c.meterValueIndex < c.meterValuesArr.length
            ) {
              this.log(
                `Connector ${connectorId}: Resuming meter values from index ${c.meterValueIndex}. Total sets: ${c.meterValuesArr.length}`
              );
            } else {
              this.log(
                `Connector ${connectorId}: Resume requested, but no valid persisted meter data found. Generating new values.`
              );
              needsGeneration = true;
              resume = false;
            }
          } else {
            needsGeneration = true;
          }

          if (needsGeneration) {
            c.meterValuesArr = this.generateMeterValues(connectorId);
            c.meterValueIndex = 0;
            this.log(`Connector ${connectorId}: Generated ${c.meterValuesArr.length} meter value sets.`);
            this.persistState();
          }

          if (!c.meterValuesArr || c.meterValuesArr.length === 0) {
            this.log("Error: No meter values available to send.");
            return;
          }

          if (c.meterValueIndex >= c.meterValuesArr.length) {
            this.log(
              `Connector ${connectorId}: Already at the end of meter values (Index: ${c.meterValueIndex}, Total: ${c.meterValuesArr.length}).`
            );
            return;
          }

          const intervalSeconds = this.config.meterSampleInterval;
          if (isNaN(intervalSeconds) || intervalSeconds <= 0) {
            this.log("Invalid meter value sample interval.");
            alert(`Simulator ${this.id}: Invalid Meter Interval (${intervalSeconds}s). Must be > 0.`);
            return;
          }

          // --- Define the sending function (closes over connectorId) ---
          const sendNext = () => {
            if (!c.currentTransactionId) {
              this.log(`Connector ${connectorId}: Transaction stopped externally. Halting MeterValues.`);
              this._stopMeterInterval(connectorId);
              return;
            }

            if (c.meterValueIndex < c.meterValuesArr.length) {
              let meterValuePayload;
              try {
                meterValuePayload = JSON.parse(JSON.stringify(c.meterValuesArr[c.meterValueIndex]));
              } catch (e) {
                this.log(
                  `Connector ${connectorId}: Error cloning meter value payload at index ${c.meterValueIndex}: ${e}`
                );
                this._stopMeterInterval(connectorId);
                return;
              }

              const now = new Date().toISOString();
              meterValuePayload.meterValue.forEach((mv) => (mv.timestamp = now));
              meterValuePayload.transactionId = c.currentTransactionId;

              if (this.sendRequest("MeterValues", meterValuePayload, connectorId)) {
                c.meterValueIndex++;
                this.persistState();
              } else {
                this.log(
                  `Connector ${connectorId}: Failed to send MeterValue (WebSocket likely closed), stopping interval.`
                );
                this._stopMeterInterval(connectorId);
              }
            } else {
              this.log(`Connector ${connectorId}: Finished sending all meter values for this transaction.`);
              this._stopMeterInterval(connectorId);
              this.sendStatusNotification(connectorId, "Finishing");
              setTimeout(() => {
                if (c.currentTransactionId) {
                  this.sendStatusNotification(connectorId, "SuspendedEVSE");
                }
              }, 2000);
            }
          };

          this.log(
            `Connector ${connectorId}: ${
              resume ? "Resuming" : "Starting"
            } MeterValues sending every ${intervalSeconds}s from index ${c.meterValueIndex}.`
          );

          sendNext();

          if (
            c.meterValueIntervalId === null &&
            c.currentTransactionId &&
            c.meterValueIndex < c.meterValuesArr.length
          ) {
            c.meterValueIntervalId = setInterval(sendNext, intervalSeconds * 1000);
          }
        }

        generateMeterValues(connectorId) {
          const numMessages = this.config.meterNumMessages;
          const minSoc = this.config.minSoc;
          const maxSoc = this.config.maxSoc;
          const minEnergy = this.config.minEnergy;
          const maxEnergy = this.config.maxEnergy;
          const avPower = this.config.avPower;
          const avCurrent = this.config.avCurrent;

          if (numMessages <= 0) return [];

          let generatedValues = [];
          const energyStep = numMessages > 1 ? (maxEnergy - minEnergy) / (numMessages - 1) : 0;
          const socStep = numMessages > 1 ? (maxSoc - minSoc) / (numMessages - 1) : 0;

          for (let i = 0; i < numMessages; i++) {
            const energyVal = Math.min(maxEnergy, minEnergy + i * energyStep).toFixed(3);
            const socVal = Math.min(maxSoc, Math.round(minSoc + i * socStep));

            const payload = {
              connectorId: connectorId,
              meterValue: [
                {
                  timestamp: new Date().toISOString(),
                  sampledValue: [
                    {
                      value: energyVal,
                      context: "Sample.Periodic",
                      format: "Raw",
                      measurand: "Energy.Active.Import.Register",
                      location: "Outlet",
                      unit: "kWh",
                    },
                  ],
                },
                {
                  timestamp: new Date().toISOString(),
                  sampledValue: [
                    {
                      value: avCurrent.toString(),
                      context: "Sample.Periodic",
                      format: "Raw",
                      measurand: "Current.Import",
                      unit: "A",
                    },
                  ],
                },
                {
                  timestamp: new Date().toISOString(),
                  sampledValue: [
                    {
                      value: socVal.toString(),
                      context: "Sample.Periodic",
                      format: "Raw",
                      measurand: "SoC",
                      unit: "Percent",
                    },
                  ],
                },
                {
                  timestamp: new Date().toISOString(),
                  sampledValue: [
                    {
                      value: avPower.toString(),
                      context: "Sample.Periodic",
                      format: "Raw",
                      measurand: "Power.Active.Import",
                      unit: "W",
                    },
                  ],
                },
              ],
            };
            generatedValues.push(payload);
          }
          return generatedValues;
        }

        // --- Transaction List UI (per connector) ---
        updateTransactionsUI(connectorId) {
          const c = this.connectors[connectorId];
          c.ui.transactionsArea.innerHTML = "";
          if (c.activeTransactions.length === 0) {
            c.ui.transactionsArea.innerHTML = "No active transactions!";
          } else {
            c.activeTransactions.forEach((txId) => {
              if (txId) {
                const div = document.createElement("div");
                div.textContent = txId;
                c.ui.transactionsArea.appendChild(div);
              }
            });
          }
          c.ui.transToStpInput.value = c.currentTransactionId || "";
          c.transactionIdToStop = c.currentTransactionId || null;
        }

        addTransactionToList(connectorId, txId) {
          const c = this.connectors[connectorId];
          if (txId && !c.activeTransactions.includes(txId)) {
            c.activeTransactions.push(txId);
            this.updateTransactionsUI(connectorId);
            this.persistState();
          }
        }

        removeTransactionFromList(connectorId, txId) {
          const c = this.connectors[connectorId];
          const index = c.activeTransactions.indexOf(txId);
          if (index > -1) {
            c.activeTransactions.splice(index, 1);
          }
          this.updateTransactionsUI(connectorId);
        }
      } // End Simulator Class

      // =============================================
      // Initialization
      // =============================================
      const simulators = [];
      const NUM_SIMULATORS = 4; // Number of simulator tabs to create
      const CONNECTORS_PER_CP = [1, 2]; // Connectors per charge point

      function getSimulatorHTMLTemplate(simId) {
        const defaultCPID = `SIM_${simId}`;
        const defaultEndpoint = "wss://ocpp-dev.evnet.xyz/ocpp/";

        // Builds the control panel for a single connector
        const connectorPanel = (cid) => `
                    <div class="connector-panel">
                      <strong>Connector ${cid}</strong>
                      <div>
                        <span>Id Tag</span>
                        <input id="idTag-${simId}-${cid}" type="text" placeholder="Id Tag" value="TAG_${simId}_${cid}" size="10"/>
                        <button id="send-${simId}-${cid}">Authorize</button>
                        <button id="start-${simId}-${cid}">Start Tx</button>
                        <input id="TransToStp-${simId}-${cid}" type="text" placeholder="Transaction Id" value="" size="10"/>
                        <button id="stop-${simId}-${cid}">Stop Tx</button>
                        <span>Status</span>
                        <input id="statusNotification-${simId}-${cid}" type="text" placeholder="Status" value="Available" size="12"/>
                        <button id="status-${simId}-${cid}">Status Notif.</button>
                        <button id="start-meter-values-${simId}-${cid}" title="Start sending new meter values for the current transaction">Start Meter Values</button>
                        <button id="resume-meter-values-${simId}-${cid}" title="Resume sending meter values from the last known point (requires persisted state)">Resume Meter Values</button>
                      </div>
                      <div style="margin-top: 5px;">
                        <span class="indicator" id="red-${simId}-${cid}" style="display:inline-block; color: red; font-weight: bold;">&#9632; Disconnected</span>
                        <span class="indicator" id="green-${simId}-${cid}" style="display:none; color: green; font-weight: bold;">&#9632; Charging</span>
                        <span class="indicator" id="yellow-${simId}-${cid}" style="display:none; color: orange; font-weight: bold;">&#9632; Connected/Idle</span>
                        <span class="indicator" id="blue-${simId}-${cid}" style="display:none; color: blue; font-weight: bold;">&#9632; Connecting...</span>
                      </div>
                    </div>`;

        return `
                <div class="flex-container">
                  <div class="item-1">
                    <!-- Shared charge-point controls -->
                    <button id="connect-${simId}">Connect</button>
                    <button id="heartbeat-${simId}">Heartbeat</button>
                    <button id="data_transfer-${simId}">Data Transfer</button>

                    <!-- Per-connector control panels -->
                    ${CONNECTORS_PER_CP.map((cid) => connectorPanel(cid)).join("")}
                  </div>
                  <div class="item-2">
                     <!-- Inner Tabs (Settings, Log, Transactions) -->
                     <ul class="tabset_tabs inner-tabs">
                        <li><a href="#tab-settings-${simId}" class="active">Settings</a></li>
                        <li><a href="#tab-log-${simId}">Log</a></li>
                        <li><a href="#tab-transactions-${simId}">Transactions</a></li>
                     </ul>
                     <div id="tab-settings-${simId}" class="tabset_content inner-content active">
                        <h2 class="tabset_label">Settings</h2>
                        <form onsubmit="return false;">
                            <span>Endpoint URL</span><input id="endp-${simId}" type="text" placeholder="Endpoint URL" value="${defaultEndpoint}" size="40"/>
                            <span>Charge Point Id</span><input id="CP-${simId}" type="text" placeholder="Charge Point Id" value="${defaultCPID}"/>
                            <span>Charge Point Vendor</span><input id="chargePointVendor-${simId}" type="text" placeholder="Charge Point Vendor" value="Simulator"/>
                            <span>Charge Point Model</span><input id="chargePointModel-${simId}" type="text" placeholder="Charge Point Model" value="JS-SIM-1.6"/>
                            <span>Meter Msgs</span><input id="meterValuesNumberOfMessages-${simId}" type="text" placeholder="# Msgs" value="60" size="5"/>
                            <span>Meter Interval (s)</span><input id="meterValueSampleIntervalInSeconds-${simId}" type="text" placeholder="Interval (s)" value="10" size="5"/>
                            <span>Min SoC (%)</span><input id="minSoc-${simId}" type="text" placeholder="Min SoC" value="10" size="5"/>
                            <span>Max SoC (%)</span><input id="maxSoc-${simId}" type="text" placeholder="Max SoC" value="95" size="5"/>
                            <span>Min Energy (kWh)</span><input id="minEnergy-${simId}" type="text" placeholder="Min kWh" value="1" size="5"/>
                            <span>Max Energy (kWh)</span><input id="maxEnergy-${simId}" type="text" placeholder="Max kWh" value="25" size="5"/>
                            <span>Av Power (W)</span><input id="avPower-${simId}" type="text" placeholder="Av Power (W)" value="7200" size="7"/>
                            <span>Av Current (A)</span><input id="avCurrent-${simId}" type="text" placeholder="Av Current (A)" value="32" size="5"/>
                            <span>Data Transfer Data</span><input id="datatrasfer-${simId}" type="text" placeholder="Data for DataTransfer" value='{"custom":"data"}' size="30"/>
                            <small style="display:block; margin-top:6px; color:#666;">Endpoint, identity and meter settings are shared by both connectors. Id Tag and Status are set per connector above.</small>
                        </form>
                     </div>
                     <div id="tab-log-${simId}" class="tabset_content inner-content">
                        <h2 class="tabset_label">Log</h2>
                        <ul id="console-${simId}" style="height: 200px; overflow-y: scroll; border: 1px solid #eee; padding: 5px; list-style: none; font-size: 0.9em; background: #f8f8f8;"></ul>
                     </div>
                     <div id="tab-transactions-${simId}" class="tabset_content inner-content">
                        <h2 class="tabset_label">Transactions</h2>
                        <p>Connector 1 &mdash; Active Transaction IDs:</p>
                        <div id="transactions-${simId}-1" style="font-family: monospace;">No active transactions!</div>
                        <p>Connector 2 &mdash; Active Transaction IDs:</p>
                        <div id="transactions-${simId}-2" style="font-family: monospace;">No active transactions!</div>
                     </div>
                  </div>
                </div>
            `;
      }

      function initializeSimulators() {
        const mainContainer = document.getElementById("simulator-container");
        const tabContainer = document.getElementById("simulator-tabs");

        for (let i = 1; i <= NUM_SIMULATORS; i++) {
          // 1. Create Main Tab Link
          const tabLink = document.createElement("li");
          const tabA = document.createElement("a");
          tabA.href = `#sim-${i}`;
          tabA.textContent = `Simulator ${i}`;
          tabA.dataset.simId = i;
          if (i === 1) tabA.classList.add("active");
          tabLink.appendChild(tabA);
          tabContainer.appendChild(tabLink);

          // 2. Create Main Tab Content Pane
          const simDiv = document.createElement("div");
          simDiv.id = `sim-${i}`;
          simDiv.classList.add("simulator-instance");
          if (i !== 1) simDiv.style.display = "none";
          simDiv.innerHTML = getSimulatorHTMLTemplate(i);
          mainContainer.appendChild(simDiv);

          // 3. Create Simulator Instance
          const simulator = new Simulator(i, simDiv);
          simulators.push(simulator);

          // 4. Initialize Inner Tabs for this instance
          initializeInnerTabs(simDiv, i);
        }

        // Add event listener for MAIN simulator tabs
        tabContainer.addEventListener("click", (event) => {
          if (event.target.tagName === "A" && event.target.dataset.simId) {
            event.preventDefault();
            const targetId = event.target.href.split("#")[1];

            mainContainer
              .querySelectorAll(".simulator-instance")
              .forEach((div) => (div.style.display = "none"));
            tabContainer.querySelectorAll("a").forEach((a) => a.classList.remove("active"));

            const targetDiv = document.getElementById(targetId);
            if (targetDiv) {
              targetDiv.style.display = "block";
            }
            event.target.classList.add("active");
          }
        });
      }

      function initializeInnerTabs(simulatorContainer, simId) {
        const innerTabs = simulatorContainer.querySelector(".inner-tabs");
        const innerContents = simulatorContainer.querySelectorAll(".inner-content");

        if (!innerTabs || innerContents.length === 0) return;

        innerTabs.addEventListener("click", (event) => {
          if (event.target.tagName === "A") {
            event.preventDefault();
            const targetContentId = event.target.getAttribute("href");

            innerContents.forEach((content) => content.classList.remove("active"));
            innerContents.forEach((content) => (content.style.display = "none"));

            innerTabs.querySelectorAll("a").forEach((a) => a.classList.remove("active"));

            const targetContent = simulatorContainer.querySelector(targetContentId);
            if (targetContent) {
              targetContent.classList.add("active");
              targetContent.style.display = "block";
            }

            event.target.classList.add("active");
          }
        });

        // Ensure initial state is correct (first tab/content active)
        innerTabs.querySelector("a").classList.add("active");
        innerContents.forEach((content, index) => {
          content.style.display = index === 0 ? "block" : "none";
          if (index === 0) content.classList.add("active");
          else content.classList.remove("active");
        });
      }

      // Initialize when the DOM is ready
      $(document).ready(function () {
        initializeSimulators();
      });
    </script>
  </body>
</html>
